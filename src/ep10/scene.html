// ---------- FIGURE ----------
const LEN={tor:165,ua:92,fa:88,th:128,sh:122,neck:50,hr:38};
const POS={
 DOWN:{hip:[3,264],tor:90,ht:0,hN:[-4,230],hF:[2,232],eb:1,aN:[0,14],aF:[8,14],kb:-1,fN:180,fF:180,fin:0,pal:-90},

 TAKBIR:{hip:[3,264],tor:90,ht:0,hN:[-44,466],hF:[-36,470],eb:1,aN:[0,14],aF:[8,14],kb:-1,fN:180,fF:180,fin:0,pal:90},
 RUKU:{hip:[30,263],tor:180,ht:0,hN:null,hF:null,eb:1,aN:[2,14],aF:[10,14],kb:-1,fN:180,fF:180,fin:0,rk:1,pal:-90},
 SUJUD:{hip:[40,150],tor:202,ht:43,hN:[-90,6],hF:[-84,6],eb:1,arm:0.8,aN:[150,40],aF:[158,40],kb:-1,fN:-95,fF:-95,fin:0,pal:180},
 JALSA:{hip:[30,68],tor:92,ht:0,hN:[-62,58],hF:[-56,56],eb:1,kN:[-90,24],kF:[-86,18],aN:[30,40],aF:[38,16],kb:-1,fN:-95,fF:0,fin:0,pal:200},
 TASH:{hip:[30,68],tor:92,ht:0,hN:[-62,58],hF:[-56,56],eb:1,kN:[-90,24],kF:[-86,18],aN:[30,40],aF:[38,16],kb:-1,fN:-95,fF:0,fin:1,pal:200},
 TAWA:{hip:[40,42],tor:93,ht:0,hN:[-55,50],hF:[-49,48],eb:1,kN:[-90,22],kF:[-84,16],aN:[30,38],aF:[22,12],kb:-1,fN:-92,fF:0,fin:1,tw:1,pal:189},
 TAWA0:{hip:[40,42],tor:93,ht:0,hN:[-55,50],hF:[-49,48],eb:1,kN:[-90,22],kF:[-84,16],aN:[30,38],aF:[22,12],kb:-1,fN:-92,fF:0,fin:0,tw:1,pal:189},
};
function precompute(){for(const k in POS){const p=POS[k];if(!p.kN){p.kN=ik(p.hip,p.aN,LEN.th,LEN.sh,p.kb)[0];p.kF=ik([p.hip[0]+4,p.hip[1]],p.aF,LEN.th,LEN.sh,p.kb)[0]}}}
function ik(P0,T,a,b,bend){const dx=T[0]-P0[0],dy=T[1]-P0[1];let d=Math.hypot(dx,dy);d=clamp(d,Math.abs(a-b)+1,a+b-0.5);
 const base=Math.atan2(dy,dx),al=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1));const j=[P0[0]+a*Math.cos(base+bend*al),P0[1]+a*Math.sin(base+bend*al)];
 const ang=Math.atan2(T[1]-j[1],T[0]-j[0]);return [j,[j[0]+b*Math.cos(ang),j[1]+b*Math.sin(ang)]]}
function mixPose(A,B,t){const o={};for(const k in B){const a=A[k],b=B[k];
 if(Array.isArray(b)&&Array.isArray(a))o[k]=[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];else if(typeof b==='number'&&typeof a==='number')o[k]=lerp(a,b,t);else o[k]=t<.5?a:b}
 for(const k in A)if(!(k in o))o[k]=t<.5?A[k]:0;const aa=A.arm||1,bb=B.arm||1;o.arm=lerp(aa,bb,t);if(typeof A.pal==='number'&&typeof B.pal==='number')o.pal=lerp(A.pal,B.pal,t);return o}
function solve(p){const r=Math.PI/180,h=p.hip,ta=p.tor*r;
 const neck=[h[0]+LEN.tor*Math.cos(ta),h[1]+LEN.tor*Math.sin(ta)];
 const sh=[h[0]+(LEN.tor-16)*Math.cos(ta),h[1]+(LEN.tor-16)*Math.sin(ta)];
 const hc=[neck[0]+LEN.neck*Math.cos(ta+p.ht*r),neck[1]+LEN.neck*Math.sin(ta+p.ht*r)];
 const LN=[p.kN,p.aN],LF=[p.kF,p.aF];
 let hN=p.hN,hF=p.hF;const am=p.arm||1;if(!hN){const f=(k,o)=>{const dx=k[0]+o-sh[0],dy=k[1]-sh[1];const d=Math.hypot(dx,dy);const L=Math.min(d,178);return [sh[0]+dx/d*L,sh[1]+dy/d*L]};hN=f(LN[0],-14);hF=f(LF[0],-10)}
 const AN=ik(sh,hN,LEN.ua*am,LEN.fa*am,p.eb),AF=ik([sh[0]+4,sh[1]],hF,LEN.ua*am,LEN.fa*am,p.eb);
 return {h,neck,sh,hc,LN,LF,AN,AF,p}}
function seg(x,a,b,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
function drawFig(p,X,s,alpha,opt={}){
 const S=solve(p);if(opt.hx)S.hc[0]+=opt.hx;const M=pt=>[X+pt[0]*s,GY-pt[1]*s];
 g.save();g.globalAlpha=alpha;
 const lw=w=>w*s;const foot=(ank,ang,col,w)=>{const r=Math.PI/180;seg(g,M(ank),M([ank[0]+40*Math.cos(ang*r),ank[1]+40*Math.sin(ang*r)]),lw(w),col)};
 // shadow
 if(!opt.noShadow){g.fillStyle='rgba(60,30,10,0.10)';g.beginPath();g.ellipse(X+(S.h[0]-20)*s,GY+4,120*s,12*s,0,0,7);g.fill()}
 const edge='rgba(250,236,218,0.95)';
 // far arm, far leg
 seg(g,M(S.LF[0]),M(p.aF),lw(36),FAR);seg(g,M([S.h[0]+4,S.h[1]]),M(S.LF[0]),lw(42),FAR);foot(p.aF,p.fF,FAR,22);
 seg(g,M([S.sh[0]+4,S.sh[1]]),M(S.AF[0]),lw(30),FAR);seg(g,M(S.AF[0]),M(S.AF[1]),lw(26),FAR);
 // torso
 seg(g,M(S.h),M(S.neck),lw(60),BODY);{const m=[S.h[0]+0.35*(S.neck[0]-S.h[0]),S.h[1]+0.35*(S.neck[1]-S.h[1])];seg(g,M(m),M(S.neck),lw(76),BODY)}
 // head
 const H_=M(S.hc);g.fillStyle=BODY;g.beginPath();g.arc(H_[0],H_[1],LEN.hr*s,0,7);g.fill();
 // near leg with light edge
 const nl=[[ [S.h,S.LN[0]],46 ],[[S.LN[0],p.aN],40]];
 for(const [[a,b],w] of nl)seg(g,M(a),M(b),lw(w+5),edge);
 {const r=Math.PI/180;seg(g,M(p.aN),M([p.aN[0]+40*Math.cos(p.fN*r),p.aN[1]+40*Math.sin(p.fN*r)]),lw(27),edge)}
 for(const [[a,b],w] of nl)seg(g,M(a),M(b),lw(w),BODY);foot(p.aN,p.fN,BODY,22);
 // heart
 const ta=p.tor*Math.PI/180;const hp=[S.h[0]+0.7*LEN.tor*Math.cos(ta)+(-22)*Math.cos(ta-Math.PI/2)*-1,S.h[1]+0.7*LEN.tor*Math.sin(ta)+(-22)*Math.sin(ta-Math.PI/2)*-1];
 const HP=M(hp);const hg=(opt.heart||0);
 const rad=(26+hg*40)*s;const gr=g.createRadialGradient(HP[0],HP[1],0,HP[0],HP[1],rad);gr.addColorStop(0,'rgba(255,211,122,'+(0.75+hg*0.25)+')');gr.addColorStop(1,'rgba(255,211,122,0)');
 g.fillStyle=gr;g.beginPath();g.arc(HP[0],HP[1],rad,0,7);g.fill();
 g.fillStyle='#FFD37A';heartShape(HP[0],HP[1],(7+hg*3)*s);
 // near arm with edge
 const na=[[[S.sh,S.AN[0]],34],[[S.AN[0],S.AN[1]],30]];
 for(const [[a,b],w] of na)seg(g,M(a),M(b),lw(w+5),edge);
 for(const [[a,b],w] of na)seg(g,M(a),M(b),lw(w),BODY);
 {const pa=(p.pal===undefined?null:p.pal);if(pa!==null&&!(p.fin>0.5)){const r=Math.PI/180;const w0=S.AN[1];seg(g,M(w0),M([w0[0]+20*Math.cos(pa*r),w0[1]+20*Math.sin(pa*r)]),lw(24),BODY)}}
 if(p.fin>0.5){const r=Math.PI/180,pa=(p.pal||190)-22,w0=S.AN[1];seg(g,M(w0),M([w0[0]+14*Math.cos((pa+12)*r),w0[1]+14*Math.sin((pa+12)*r)]),lw(24),BODY);seg(g,M(w0),M([w0[0]+46*Math.cos(pa*r),w0[1]+46*Math.sin(pa*r)]),lw(10),BODY)}
 g.restore();return {S,M,HP,H:H_}}
function heartShape(x,y,r){g.beginPath();g.moveTo(x,y+r*0.9);g.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.6,y-r*1.4,x,y-r*0.45);g.bezierCurveTo(x+r*0.6,y-r*1.4,x+r*1.6,y-r*0.2,x,y+r*0.9);g.fill()}
function prayRug(X,s,a,len){g.save();g.globalAlpha=a;const x0=X-200*s,x1=X+150*s;g.fillStyle='#9E3A2E';g.beginPath();g.moveTo(x0+10,GY+2);g.lineTo(x1-10,GY+2);g.lineTo(x1,GY+14*s);g.lineTo(x0,GY+14*s);g.fill();
 g.strokeStyle='rgba(255,230,200,0.55)';g.lineWidth=2;for(let x=x0+20;x<x1-10;x+=26*s){g.beginPath();g.moveTo(x,GY+5);g.lineTo(x+8*s,GY+11*s);g.stroke()}g.restore()}

// pose timeline
const PT=[[0,'DOWN']];
function key(i,n){PT.push([T0(i)-0.05,n])}
key(38,'DOWN');key(50,'TAKBIR');key(62,'CHEST');key(97,'RUKU');key(120,'TAKBIR');key(134,'CHEST');key(142,'SUJUD');key(165,'JALSA');key(182,'SUJUD');key(189,'CHEST');key(210,'TASH');key(216,'TAKBIR');key(221,'CHEST');key(225,'TAWA');key(275,'TAWA0');
function poseAt(t){let i=0;while(i+1<PT.length&&PT[i+1][0]<=t)i++;const cur=POS[PT[i][1]];if(i===0)return cur;const prev=POS[PT[i-1][1]];const u=(t-PT[i][0])/0.55;return u>=1?cur:mixPose(prev,cur,ease(u))}

// ---------- BACKGROUND ----------
const BG=[[0,'#F4E7D2','#EAD5B6'],[STEPSTART[1],'#F7E6D6','#EFD4BE'],[STEPSTART[6],'#F8E3CE','#F0CDAE'],[STEPSTART[11],'#F5E9D6','#ECD8BA'],[CLOSE0,'#E6F1E6','#D2E6D6'],[CARD0,'#FBF4E8','#F2E6D2']];
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mixc(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}
let GRAIN=null;
function makeGrain(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const im=x.createImageData(W,H);const r=rng(7);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=10}x.putImageData(im,0,0);GRAIN=c}
function drawBG(t){let i=0;while(i+1<BG.length&&BG[i+1][0]<=t)i++;let top=BG[i][1],bot=BG[i][2];
 if(i>0){const u=ease((t-BG[i][0])/0.9);top=mixc(BG[i-1][1],BG[i][1],u);bot=mixc(BG[i-1][2],BG[i][2],u)}else{top=mixc(top,top,0);bot=mixc(bot,bot,0)}
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);
 const gw=g.createRadialGradient(560,1180,0,560,1180,620);gw.addColorStop(0,'rgba(255,214,160,0.30)');gw.addColorStop(1,'rgba(255,214,160,0)');g.fillStyle=gw;g.fillRect(0,0,W,H);
 // floor
 g.fillStyle='rgba(255,255,255,0.16)';g.fillRect(0,GY,W,H-GY);
 g.strokeStyle='rgba(120,80,50,0.25)';g.lineWidth=3;g.beginPath();g.moveTo(0,GY);g.lineTo(W,GY);g.stroke();
 g.setLineDash([22,16]);g.strokeStyle='rgba(120,80,50,0.20)';g.lineWidth=2;g.beginPath();g.moveTo(0,GY+42);g.lineTo(W,GY+42);g.stroke();g.setLineDash([]);
 g.drawImage(GRAIN,0,0)}

// ---------- TEXT ----------
function fitFont(lines,font,max){g.font=font;let m=0;for(const l of lines){m=Math.max(m,g.measureText(l).width)}return m>max?max/m:1}
function wordsW(idx,font){g.font=font;const sp=g.measureText(' ').width;const ws=idx.map(i=>g.measureText(disp(i)).width);return {ws,sp,tot:ws.reduce((a,b)=>a+b,0)+sp*(idx.length-1)}}
function drawPage(p,t,y0){
 const fade=clamp((t-p.t0)/0.25,0,1)*clamp((p.t1+0.05-t)/0.25,0,1);if(fade<=0)return;
 const isD=p.k==='d';const fs=isD?(p.small?74:84):(p.big?80:66);const lh=isD?(p.small?100:114):(p.big?112:96);
 const font=isD?`700 ${fs}px Amiri`:`900 ${fs}px Taj`;
 // scale to fit
 let sc=1;for(const L of p.L){const m=wordsW(L,font);if(m.tot>(isD?840:900))sc=Math.min(sc,(isD?840:900)/m.tot)}
 const fsz=fs*sc,F=isD?`700 ${fsz}px Amiri`:`900 ${fsz}px Taj`;
